<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>WOLFICH · Пульт</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root { --bg: #120d1f; --card: #1d1530; --line: rgba(240,200,110,.28); --gold: #f2c86e; --text: #ece6f6; --muted: #a79cbd; --ok: #57b77a; --bad: #e06464; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.4 -apple-system, "Segoe UI", Roboto, sans-serif; }
  body { padding: 14px 14px 24px; }
  h1 { margin: 0 0 4px; font-size: 1.25rem; color: var(--gold); letter-spacing: .02em; }
  .sub { color: var(--muted); font-size: .85rem; margin-bottom: 14px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; margin-bottom: 12px; }
  .card h2 { margin: 0 0 8px; font-size: .95rem; color: var(--gold); font-weight: 700; }
  select { width: 100%; padding: 10px; border-radius: 10px; border: 1px solid var(--line); background: #0d0918; color: var(--text); font: inherit; }
  .row { display: flex; align-items: center; gap: 10px; padding: 7px 0; border-bottom: 1px solid rgba(255,255,255,.05); }
  .row:last-child { border-bottom: 0; }
  .trs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 10px; margin-bottom: 8px; }
  .trs label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted, #b9a9d6); }
  .trs label.wide { grid-column: 1 / -1; }
  .trs select { padding: 8px 10px; }
  .ttl { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted, #b9a9d6); }
  .row .ico { width: 34px; height: 34px; display: flex; align-items: center; justify-content: center; }
  .row .ico img { width: 32px; height: 32px; object-fit: contain; }
  .shot { margin-top: 10px; display: none; }
  .shot img { width: 100%; border-radius: 10px; border: 1px solid var(--line); display: block; }
  .shot small { color: var(--muted); font-size: .8rem; }
  .btn2 { width: 100%; margin-top: 10px; padding: 10px; border-radius: 10px; border: 1px solid var(--line); background: #2a2140; color: var(--text); font: 600 .95rem inherit; }
  .btn2:disabled { opacity: .5; }
  .tg { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,.05); }
  .tg:last-of-type { border-bottom: 0; }
  .tg .nm { flex: 1; }
  .tg .ico { width: 34px; height: 34px; display: flex; align-items: center; justify-content: center; }
  .tg .ico img { width: 32px; height: 32px; object-fit: contain; }
  .tg input { display: none; }
  .tg i { width: 44px; height: 26px; border-radius: 13px; background: #3a3150; position: relative; transition: background .15s; }
  .tg i::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #cfc6e0; transition: left .15s; }
  .tg input:checked + i { background: #c99a3c; }
  .tg input:checked + i::after { left: 21px; background: #fff; }
  .row .nm { flex: 1; }
  .step { display: flex; align-items: center; gap: 6px; }
  .step button { width: 36px; height: 36px; border-radius: 10px; border: 1px solid var(--line); background: #2a2140; color: var(--text); font-size: 1.2rem; line-height: 1; }
  .step button:active { background: #3a2d58; }
  .step b { width: 26px; text-align: center; font-size: 1.1rem; }
  .sum { color: var(--muted); font-size: .85rem; margin-top: 8px; }
  .main { display: block; width: 100%; margin-top: 12px; padding: 14px; border: 0; border-radius: 14px; background: linear-gradient(180deg, #f2c86e, #c99a3c); color: #1a1208; font: 700 1.05rem inherit; box-shadow: 0 4px 14px rgba(0,0,0,.35); }
  .main:disabled { opacity: .45; }
  .banner { display: block; width: 100%; max-width: 520px; margin: 0 auto 12px; }
  .main.ic { display: flex; align-items: center; justify-content: center; gap: 10px; padding: 8px 14px; min-height: 56px; }
  .main.ic img { width: 42px; height: 42px; object-fit: contain; flex: none; filter: drop-shadow(0 1px 2px rgba(0,0,0,.4)); }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .two .main { margin-top: 0; font-size: .95rem; }
  .tm { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,.05); }
  .tm .nm { flex: 1; }
  .tm .nm small { display: block; color: var(--muted); font-size: .78rem; }
  .tm input { width: 52px; padding: 8px 6px; border-radius: 9px; border: 1px solid var(--line); background: #0d0918; color: var(--text); font: 600 1rem inherit; text-align: center; }
  .tm span.u { color: var(--muted); font-size: .85rem; }
  .tmh { display: flex; align-items: center; justify-content: space-between; margin-top: 10px; color: var(--gold); font-weight: 700; font-size: .9rem; }
  .mini { padding: 4px 10px; border-radius: 8px; border: 1px solid var(--line); background: #2a2140; color: var(--muted); font: 600 .78rem inherit; }
  .mini:active { background: #3a2d58; }
  .hint { color: var(--muted); font-size: .8rem; margin: 4px 0 2px; }
  .warn { margin-top: 10px; padding: 8px 10px; border-radius: 10px; font-size: .82rem; background: rgba(242,200,110,.10); border: 1px solid rgba(242,200,110,.35); color: #f3e2b8; }
  .warn.hot { background: rgba(224,100,100,.14); border-color: rgba(224,100,100,.5); color: #ffd0d0; }
  .chips { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
  .chip { text-align: left; padding: 9px 11px; border-radius: 12px; border: 1px solid var(--line); background: #2a2140; color: var(--text); font: inherit; }
  .chip b { display: block; font-size: .95rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chip.dis { opacity: .55; }
  .stopb { border-color: rgba(224,100,100,.55) !important; color: #ffc9c9 !important; background: rgba(224,100,100,.12) !important; }
  .chip small u { color: var(--bad); text-decoration: underline; }
  .chip small { display: block; color: var(--muted); font-size: .78rem; margin-top: 2px; }
  .chip.sel { border-color: var(--gold); background: linear-gradient(180deg, rgba(242,200,110,.22), rgba(242,200,110,.08)); box-shadow: 0 0 0 1px var(--gold) inset; }
  .tabname { color: var(--muted); font-weight: 400; }
  .ldi { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,.05); }
  .ldi:last-child { border-bottom: 0; }
  .ldi .nm { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ldi .on { color: var(--ok); font-size: .85rem; }
  .ldi button { padding: 7px 12px; border-radius: 9px; border: 1px solid var(--line); background: #2a2140; color: var(--text); font: 600 .85rem inherit; }
  .ldi button:disabled { opacity: .5; }
  .ldb { background: #ffcc00 !important; color: #111 !important; }
  .st { font-size: .9rem; white-space: pre-line; }
  .st small { display: block; color: var(--muted); margin-top: 4px; }
  .msg { padding: 10px 12px; border-radius: 10px; margin-bottom: 12px; font-size: .9rem; display: none; }
  .msg.ok { display: block; background: rgba(87,183,122,.15); border: 1px solid rgba(87,183,122,.4); }
  .msg.bad { display: block; background: rgba(224,100,100,.15); border: 1px solid rgba(224,100,100,.4); }
  .link { background: none; border: 0; color: var(--gold); font: inherit; text-decoration: underline; padding: 0; margin-top: 8px; }
  .note { color: var(--muted); font-size: .8rem; }
</style>
</head>

  <div class="note" style="margin-top:8px" data-t="График, перерывы и интервалы из настроек бота здесь не действуют. С временем фарма бот держит марши по плану, проверяет их с заданной частотой, делает перерывы, а когда время выйдет — уходит в замок, присылает снимок и выключается. Без времени фарма — отправит марши и сообщит, когда все вернутся.|Bot schedule, breaks and intervals don't apply here. With a farming time the bot keeps marches per plan, checks them at the set interval, takes breaks and, when time is up, goes to the castle, sends a screenshot and stops. Without it — sends marches once and reports when all are back."></div>

<div class="card">
  <h2 data-t="Обучение войск|Troop training"></h2>
  <div class="trs" id="trs"></div>
  <div class="note" style="margin:2px 0 10px" data-t="Тир узнаётся по цвету значка: серый Т1, зелёный Т2, синий Т3, фиолетовый Т4, золотой Т5. «Как в боте» — взять тир из настроек программы (⚙ Настройки → Обучение войск). Количество — сколько предлагает игра, «Мгновенно» за самоцветы бот не нажимает.|Tier is recognised by the badge colour: grey T1, green T2, blue T3, purple T4, gold T5. «As in the bot» uses the tier from the program settings (⚙ Settings → Troop training). Amount is what the game offers; the bot never taps «Instant»."></div>
  <button class="main" id="trainBtn" type="button"><span data-t="🪖 Обучить войска|🪖 Train troops"></span></button>
  <div class="note" style="margin-top:8px" data-t="Бот заберёт готовые войска и поставит обучение во все свободные очереди по выбранным тирам, пришлёт отчёт и поставит напоминание об окончании. Нет свободных казарм и готовых войск — пропустит этот шаг, пришлёт отчёт и напоминания по текущей очереди. Если бот уже работает (автопоход или марши с пульта) — обучит при ближайшем ожидании маршей и продолжит по своему графику; иначе после обучения выключится.|The bot collects ready troops, trains in every free queue with the chosen tiers, reports and sets a reminder for the end. No free barracks and no ready troops — it skips this step, reports and sets reminders for the current queue. If the bot is already working (auto run or remote marches) it trains at the next march wait and keeps its schedule; otherwise it stops after training."></div>
</div>

<div class="card">
  <h2 data-t="Титул|Title"></h2>
  <label class="ttl"><span data-t="Титул советника|Advisor title"></span>
    <select id="ttlSel">
      <option value="0" data-t="Старший шпион|Chief Spy"></option>
      <option value="1" data-t="Старший надзиратель|Chief Overseer"></option>
      <option value="2" data-t="Архимаг|Archmage"></option>
      <option value="3" data-t="Верховный учёный|Grand Scholar"></option>
    </select></label>
  <div class="note warn" style="margin-top:8px" data-t="⚠️ Необходимо установить Общую метку с наименованием Дракон / Dragon на английском, на флаге короля.|⚠️ You need a Shared bookmark named Dragon (Дракон in Russian) on the king's banner."></div>
  <button class="main" id="ttlBtn" type="button" style="margin-top:10px"><span data-t="👑 Встать в очередь на титул|👑 Queue for the title"></span></button>
  <div class="note" style="margin-top:8px" data-t="Бот выйдет на карту, откроет звезду «Метки» → «Общие» → метку «Дракон» → «Перейти», затем знамя Верховного короля → Привилегии → Титулы и подаст заявку. Пришлёт время, когда титул будет активен (UTC и местное), и напомнит в Telegram в момент начала. Если титул уже твой или заявка уже подана — пропустит. Если бот уже работает — сделает это при ближайшем ожидании маршей.|The bot opens the map, the star «Bookmarks» → «Shared» → bookmark «Dragon» → «Go», then the Supreme King banner → Privileges → Titles and applies. Sends the time the title becomes active (UTC and local) and reminds you in Telegram when it starts. Skips if the title is already yours or you are already queued. If the bot is busy it does this at the next march wait."></div>
</div>

<div class="card">

    if (tv.farm && tv.rest < 1) { msg(T("Укажите проверку — хотя бы раз в 1 минуту|Set check — at least every 1 minute")); $("go").disabled = false; return; }
    if (tv.farm && (!tv.brk !== !tv.brkLen)) { msg(T("Для перерыва укажите и «каждые», и длительность — или оставьте оба по нулям|For a break set both «every» and the length — or leave both at zero")); $("go").disabled = false; return; }
    api("send", { rid: cur.rid, inst: cur.inst, plan: plan, farm: tv.farm, rest: tv.rest || 10, brk: tv.brk, brkLen: tv.brkLen }).then(function (j) {
      if (!j || !j.ok) { msg(j && j.err || T("Не отправлено|Not sent")); $("go").disabled = false; return; }
      msg(T("✅ Команда отправлена. Программа возьмёт её в течение 30 секунд и напишет в этот чат.|✅ Command sent. The program will pick it up within 30 seconds and write to this chat."), true);
      try { TG.HapticFeedback.notificationOccurred("success"); } catch (e) {}
      load(true);
    }).catch(function () { msg(T("Нет связи с сервером|No connection to the server")); $("go").disabled = false; });
  });
  drawRes();
  if (!TG || !TG.initData) { msg(T("Откройте пульт из Telegram-бота WOLFICH.|Open the remote from the WOLFICH Telegram bot.")); $("go").disabled = true; $("shotBtn").disabled = true; $("allyBtn").disabled = true; $("rstBtn").disabled = true; $("clsBtn").disabled = true; $("multiBtn").disabled = true; $("stopBtn").disabled = true; $("trainBtn").disabled = true; $("ttlBtn").disabled = true; return; }
  load();
  (function tick() {   // 3 с, пока что-то ждёт ответа программы; иначе 10 с
    setTimeout(function () { (document.visibilityState === "visible" ? load(true) : Promise.resolve()).catch(function () {}).then(tick); }, fast ? 3000 : 10000);
  })();
})();
</script>

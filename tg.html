<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>WOLFICH · Пульт</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root { --bg: #120d1f; --card: #1d1530; --line: rgba(240,200,110,.28); --gold: #f2c86e; --text: #ece6f6; --muted: #a79cbd; --ok: #57b77a; --bad: #e06464; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.4 -apple-system, "Segoe UI", Roboto, sans-serif; }
  body { padding: 14px 14px 24px; }
  h1 { margin: 0 0 4px; font-size: 1.25rem; color: var(--gold); letter-spacing: .02em; }
  .sub { color: var(--muted); font-size: .85rem; margin-bottom: 14px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; margin-bottom: 12px; }
  .card h2 { margin: 0 0 8px; font-size: .95rem; color: var(--gold); font-weight: 700; }
  select { width: 100%; padding: 10px; border-radius: 10px; border: 1px solid var(--line); background: #0d0918; color: var(--text); font: inherit; }
  .row { display: flex; align-items: center; gap: 10px; padding: 7px 0; border-bottom: 1px solid rgba(255,255,255,.05); }
  .row:last-child { border-bottom: 0; }
  .row .ico { width: 34px; height: 34px; display: flex; align-items: center; justify-content: center; }
  .row .ico img { width: 32px; height: 32px; object-fit: contain; }
  .shot { margin-top: 10px; display: none; }
  .shot img { width: 100%; border-radius: 10px; border: 1px solid var(--line); display: block; }
  .shot small { color: var(--muted); font-size: .8rem; }
  .btn2 { width: 100%; margin-top: 10px; padding: 10px; border-radius: 10px; border: 1px solid var(--line); background: #2a2140; color: var(--text); font: 600 .95rem inherit; }
  .btn2:disabled { opacity: .5; }
  .tg { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,.05); }
  .tg:last-of-type { border-bottom: 0; }
  .tg .nm { flex: 1; }
  .tg input { display: none; }
  .tg i { width: 44px; height: 26px; border-radius: 13px; background: #3a3150; position: relative; transition: background .15s; }
  .tg i::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #cfc6e0; transition: left .15s; }
  .tg input:checked + i { background: #c99a3c; }
  .tg input:checked + i::after { left: 21px; background: #fff; }
  .row .nm { flex: 1; }
  .step { display: flex; align-items: center; gap: 6px; }
  .step button { width: 36px; height: 36px; border-radius: 10px; border: 1px solid var(--line); background: #2a2140; color: var(--text); font-size: 1.2rem; line-height: 1; }
  .step button:active { background: #3a2d58; }
  .step b { width: 26px; text-align: center; font-size: 1.1rem; }
  .sum { color: var(--muted); font-size: .85rem; margin-top: 8px; }
  .main { display: block; width: 100%; margin-top: 12px; padding: 14px; border: 0; border-radius: 14px; background: linear-gradient(180deg, #f2c86e, #c99a3c); color: #1a1208; font: 700 1.05rem inherit; box-shadow: 0 4px 14px rgba(0,0,0,.35); }
  .main:disabled { opacity: .45; }
  .st { font-size: .9rem; white-space: pre-line; }
  .st small { display: block; color: var(--muted); margin-top: 4px; }
  .msg { padding: 10px 12px; border-radius: 10px; margin-bottom: 12px; font-size: .9rem; display: none; }
  .msg.ok { display: block; background: rgba(87,183,122,.15); border: 1px solid rgba(87,183,122,.4); }
  .msg.bad { display: block; background: rgba(224,100,100,.15); border: 1px solid rgba(224,100,100,.4); }
  .link { background: none; border: 0; color: var(--gold); font: inherit; text-decoration: underline; padding: 0; margin-top: 8px; }
  .note { color: var(--muted); font-size: .8rem; }
</style>
</head>
<body>
<h1>🐺 WOLFICH · <span data-t="Пульт|Remote"></span></h1>
<div class="sub" data-t="Разовая отправка маршей. Программа WOLFICH на компьютере должна быть запущена.|One-off march sending. The WOLFICH program must be running on your computer."></div>
<div class="msg" id="msg"></div>

<div class="card" id="botCard" style="display:none">
  <h2 data-t="Бот|Bot"></h2>
  <select id="bot"></select>
</div>

<div class="card">
  <h2 data-t="Последнее событие|Last event"></h2>
  <div class="st" id="st">…</div>
  <button class="link" id="refresh" type="button" data-t="Обновить|Refresh"></button>
  <button class="link" id="cancel" type="button" style="display:none;margin-left:14px" data-t="Отменить команду|Cancel command"></button>
  <button class="btn2" id="shotBtn" type="button" data-t="📸 Запросить скриншот|📸 Request screenshot"></button>
  <div class="shot" id="shot"><img id="shotImg" alt=""><small id="shotTs"></small>
    <button class="btn2" id="shotDel" type="button" data-t="🗑 Удалить скриншот|🗑 Delete screenshot"></button></div>
</div>

<div class="card">
  <h2 data-t="Куда отправить марши|Where to send marches"></h2>
  <div id="res"></div>
  <div class="sum" id="sum"></div>
  <button class="main" id="go" type="button" data-t="Отправить марши|Send marches"></button>
  <div class="note" style="margin-top:8px" data-t="Для этой отправки график работы, перерывы и интервалы из настроек бота не действуют. Когда все марши вернутся домой, придёт сообщение.|Work schedule, breaks and bot intervals do not apply to this sending. You'll get a message when all marches are back home."></div>
</div>
<div class="card">
  <h2 data-t="Обход альянса|Alliance round"></h2>
  <label class="tg"><span class="ico">🎁</span><span class="nm" data-t="Подарки|Gifts"></span><input type="checkbox" id="aG" checked><i></i></label>
  <label class="tg"><span class="ico">🔬</span><span class="nm" data-t="Технологии|Technology"></span><input type="checkbox" id="aX" checked><i></i></label>
  <label class="tg"><span class="ico">🏰</span><span class="nm" data-t="Сбор с территории|Territory income"></span><input type="checkbox" id="aT" checked><i></i></label>
  <button class="main" id="allyBtn" type="button" data-t="🤝 Обойти альянс|🤝 Alliance round"></button>
  <div class="note" style="margin-top:8px" data-t="Кнопку «Помощь» бот не нажимает. Если идёт отправка с пульта — сделает обход между проверками маршей, иначе обойдёт альянс и выключится. В отчёте — снимок после каждой операции.|The bot does not press «Help». During a remote sending it does the round between march checks; otherwise it does the round and stops. The report has a screenshot after each step."></div>
</div>

<div class="card">
  <h2 data-t="Игра|Game"></h2>
  <button class="main" id="rstBtn" type="button" data-t="🔄 Перезапустить игру|🔄 Restart the game"></button>
  <div class="note" style="margin-top:8px" data-t="Если в аккаунт зашли с другого устройства: бот нажмёт синюю кнопку, выйдет в меню LDPlayer и запустит Call of Dragons. Работающий бот при этом остановится. Через минуту придёт снимок.|If the account was opened on another device: the bot presses the blue button, goes to the LDPlayer menu and starts Call of Dragons. A running bot stops. A screenshot arrives in about a minute."></div>
</div>

      if (!j || !j.ok) { msg(j && j.err || T("Сервер не ответил|Server did not respond")); $("go").disabled = true; return; }

      var o = opts(), sel = $("bot");
      sel.innerHTML = o.map(function (x, i) { return '<option value="' + i + '">' + x.label.replace(/</g, "&lt;") + '</option>'; }).join("");
      var keep = cur && o.findIndex(function (x) { return x.rid === cur.rid && x.inst === cur.inst; });
      sel.value = String(keep >= 0 ? keep : 0); cur = o[+sel.value] || null;
      $("botCard").style.display = o.length > 1 ? "" : "none";
      drawState(); drawRes();
    }).catch(function () { msg(T("Нет связи с сервером|No connection to the server")); });
  }
  $("bot").addEventListener("change", function () { cur = opts()[+$("bot").value] || null; $("shot").style.display = "none"; shotSeen = {}; drawState(); drawRes(); });
  $("refresh").addEventListener("click", function () { load(); });
  $("cancel").addEventListener("click", function () { if (!cur) return; api("cancel", { rid: cur.rid, inst: cur.inst }).then(function () { msg(T("Команда отменена|Command cancelled"), true); load(true); }); });
  $("go").addEventListener("click", function () {
    if (!cur || !total()) return;
    $("go").disabled = true; haptic("medium");
    api("send", { rid: cur.rid, inst: cur.inst, plan: plan }).then(function (j) {
      if (!j || !j.ok) { msg(j && j.err || T("Не отправлено|Not sent")); $("go").disabled = false; return; }
      msg(T("✅ Команда отправлена. Программа возьмёт её в течение 30 секунд и напишет в этот чат.|✅ Command sent. The program will pick it up within 30 seconds and write to this chat."), true);
      try { TG.HapticFeedback.notificationOccurred("success"); } catch (e) {}
      load(true);
    }).catch(function () { msg(T("Нет связи с сервером|No connection to the server")); $("go").disabled = false; });
  });
  drawRes();
  if (!TG || !TG.initData) { msg(T("Откройте пульт из Telegram-бота WOLFICH.|Open the remote from the WOLFICH Telegram bot.")); $("go").disabled = true; $("shotBtn").disabled = true; $("allyBtn").disabled = true; $("rstBtn").disabled = true; return; }
  load();
  setInterval(function () { if (document.visibilityState === "visible") load(true); }, 15000);
})();
</script>

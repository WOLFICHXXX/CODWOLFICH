# Зеркало бота в Yandex Cloud: при каждой заливке в ветку bot копирует модуль бота (и один раз — распознавание текста)
# в хранилище Yandex Object Storage. Нужны секреты репозитория: YC_KEY_ID, YC_SECRET, YC_BUCKET.
name: Зеркало в Yandex Cloud
on:
  push:
    branches: [bot]
  workflow_dispatch:
jobs:
  mirror:
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.YC_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.YC_SECRET }}
      AWS_DEFAULT_REGION: ru-central1
      BUCKET: ${{ secrets.YC_BUCKET }}
      E: https://storage.yandexcloud.net
      # новые версии AWS CLI шлют свои контрольные суммы, Yandex Object Storage их не понимает
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
    steps:
      - uses: actions/checkout@v4
      - name: Секреты не заданы — пропускаем
        if: env.BUCKET == ''
        run: echo "Секреты YC_KEY_ID / YC_SECRET / YC_BUCKET не заданы — зеркало не обновляется"
      - name: Зеркало
        if: env.BUCKET != ''
        shell: bash
        run: |
          # ошибки показываем в «Annotations», чтобы их было видно без полного журнала
          fail() { echo "::error::$1: $(tail -c 700 /tmp/out.txt | tr '\n' ' ')"; exit 1; }
          run() { "$@" > /tmp/out.txt 2>&1; }
          # в секретах бывает лишний перевод строки при вставке — убираем пробелы и переводы строк
          export AWS_ACCESS_KEY_ID="$(printf %s "$AWS_ACCESS_KEY_ID" | tr -d '[:space:]')"
          export AWS_SECRET_ACCESS_KEY="$(printf %s "$AWS_SECRET_ACCESS_KEY" | tr -d '[:space:]')"
          BUCKET="$(printf %s "$BUCKET" | tr -d '[:space:]')"
          echo '{"CORSRules":[{"AllowedOrigins":["*"],"AllowedMethods":["GET","HEAD"],"AllowedHeaders":["*"],"MaxAgeSeconds":3600}]}' > cors.json
          run aws --endpoint-url=$E s3api put-bucket-cors --bucket "$BUCKET" --cors-configuration file://cors.json || echo "::warning::CORS: $(tail -c 500 /tmp/out.txt | tr '\n' ' ')"
          run aws --endpoint-url=$E s3 cp owner.bin "s3://$BUCKET/owner.bin" --acl public-read --cache-control no-store --content-type application/octet-stream || fail "owner.bin"
          echo "::notice::owner.bin загружен"
          if [ -f tg.html ]; then run aws --endpoint-url=$E s3 cp tg.html "s3://$BUCKET/tg.html" --acl public-read --cache-control no-cache --content-type "text/html; charset=utf-8" || fail "tg.html"; echo "::notice::tg.html (пульт) загружен"; fi
          if aws --endpoint-url=$E s3 ls "s3://$BUCKET/tess/lang/rus.traineddata.gz" >/dev/null 2>&1; then echo "::notice::распознавание текста уже есть"; exit 0; fi
          mkdir t && cd t
          run npm pack tesseract.js@5.1.1 tesseract.js-core@5.1.1 @tesseract.js-data/rus @tesseract.js-data/eng || fail "npm pack"
          for f in *.tgz; do d="${f%.tgz}"; mkdir -p "$d"; tar xzf "$f" -C "$d"; done
          mkdir -p up/core up/lang
          cp tesseract.js-5.1.1/package/dist/tesseract.min.js tesseract.js-5.1.1/package/dist/worker.min.js up/ || { ls > /tmp/out.txt; fail "dist"; }
          cp tesseract.js-core-5.1.1/package/*.js up/core/
          cp tesseract.js-core-5.1.1/package/*.wasm up/core/ 2>/dev/null || true
          find . -path '*4.0.0_best_int*' -name 'rus.traineddata.gz' -exec cp {} up/lang/ \;
          find . -path '*4.0.0_best_int*' -name 'eng.traineddata.gz' -exec cp {} up/lang/ \;
          if ! test -f up/lang/rus.traineddata.gz || ! test -f up/lang/eng.traineddata.gz; then find . -name '*.traineddata*' > /tmp/out.txt; fail "языки"; fi
          run aws --endpoint-url=$E s3 sync up "s3://$BUCKET/tess/" --acl public-read || fail "загрузка tess"
          echo "::notice::распознавание текста загружено: $(find up -type f | wc -l) файлов"

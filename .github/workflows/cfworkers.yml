# Cloudflare Workers (wolfich-license, wolfich-notify): код — cloudflare/<имя>/worker.js.
# Заливка в test с изменением worker.js — выкладка этого Worker'а (только код, привязки и секреты не трогаются).
# Защита: если в Cloudflare код отличается от прежней версии в репозитории (меняли в панели) — не выкладываем, нужен pull.
# Вручную: check — доступ, pull — забрать код из Cloudflare в репозиторий (коммит в test), deploy — выложить принудительно.
# Секреты: CF_API_TOKEN (Workers Scripts: Edit), CF_ACCOUNT_ID.
name: Cloudflare Workers
on:
  push:
    branches: [test]
    paths: ['cloudflare/**/worker.js']
  workflow_dispatch:
    inputs:
      mode:
        description: 'check — доступ, pull — забрать код из Cloudflare, deploy — выложить из репозитория'
        type: choice
        options: [check, pull, deploy]
        default: check
      worker:
        description: 'какой Worker'
        type: choice
        options: [all, wolfich-license, wolfich-notify]
        default: all
permissions:
  contents: write
concurrency: { group: cfworkers, cancel-in-progress: false }
jobs:
  cf:
    runs-on: ubuntu-latest
    env:
      TOKEN: ${{ secrets.CF_API_TOKEN }}
      ACC: ${{ secrets.CF_ACCOUNT_ID }}
      MODE: ${{ inputs.mode || 'auto' }}
      ONLY: ${{ inputs.worker || 'all' }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0, ref: test }
      - name: Доступ к Cloudflare
        shell: bash
        run: |
          if [ -z "$TOKEN" ] || [ -z "$ACC" ]; then echo "::error::Не заданы секреты CF_API_TOKEN / CF_ACCOUNT_ID"; exit 1; fi
          ACC=$(printf %s "$ACC" | tr -d '[:space:]'); echo "ACC=$ACC" >> "$GITHUB_ENV"
          R=$(curl -sS -H "Authorization: Bearer $(printf %s "$TOKEN" | tr -d '[:space:]')" "https://api.cloudflare.com/client/v4/accounts/$ACC/workers/scripts")
          if [ "$(echo "$R" | jq -r .success)" != "true" ]; then echo "::error::Нет доступа: $(echo "$R" | jq -c '.errors' | head -c 400)"; exit 1; fi
          echo "::notice::Доступ есть: $(echo "$R" | jq -c '[.result[] | {id, modified_on}]')"
      - name: Код из Cloudflare
        shell: bash
        run: |
          T=$(printf %s "$TOKEN" | tr -d '[:space:]')
          get() {   # $1 — имя Worker'а, $2 — куда записать код (ответ бывает multipart — достаём worker.js)
            curl -sS -D "$RUNNER_TEMP/h.txt" -H "Authorization: Bearer $T" "https://api.cloudflare.com/client/v4/accounts/$ACC/workers/scripts/$1/content/v2" -o "$RUNNER_TEMP/raw"
            python3 - "$RUNNER_TEMP/raw" "$2" "$RUNNER_TEMP/h.txt" <<'PY'
          import sys, re
          raw = open(sys.argv[1], 'rb').read(); hdr = open(sys.argv[3], encoding='latin-1').read()
          m = re.search(r'boundary=("?)([^";\r\n]+)\1', hdr, re.I)
          if m:
              b = ('--' + m.group(2)).encode()
              for p in raw.split(b):
                  h, _, body = p.lstrip(b'\r\n').partition(b'\r\n\r\n')
                  if b'filename' in h or b'name="worker.js"' in h:
                      raw = body.rsplit(b'\r\n', 1)[0] if body.endswith(b'\r\n') else body; break
          open(sys.argv[2], 'wb').write(raw)
          PY
          }
          for W in wolfich-license wolfich-notify; do
            get "$W" "$RUNNER_TEMP/$W.cf.js"
            head -c 120 "$RUNNER_TEMP/$W.cf.js" | grep -q '"success":false' && { echo "::error::$W: не удалось скачать код"; exit 1; }
            echo "::notice::$W в Cloudflare: $(wc -c < "$RUNNER_TEMP/$W.cf.js") байт, в репозитории: $(wc -c < cloudflare/$W/worker.js) байт"
          done
      - name: Забрать код в репозиторий (pull)
        if: env.MODE == 'pull'
        shell: bash
        run: |
          for W in wolfich-license wolfich-notify; do
            [ "$ONLY" = all ] || [ "$ONLY" = "$W" ] || continue
            cp "$RUNNER_TEMP/$W.cf.js" "cloudflare/$W/worker.js"
          done
          if git diff --quiet -- cloudflare; then echo "::notice::Код в репозитории уже совпадает с Cloudflare"; exit 0; fi
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git add cloudflare && git commit -q -m "Cloudflare Workers: код забран из Cloudflare ($ONLY)" && git push -q origin HEAD:test
          echo "::notice::Код из Cloudflare сохранён в репозиторий: $(git rev-parse --short HEAD)"
      - name: Выложить
        if: env.MODE == 'auto' || env.MODE == 'deploy'
        shell: bash
        run: |
          set -e
          T=$(printf %s "$TOKEN" | tr -d '[:space:]'); B="${{ github.event.before }}"; done_any=0
          for W in wolfich-license wolfich-notify; do
            F="cloudflare/$W/worker.js"
            if [ "$MODE" = auto ]; then
              git cat-file -e "$B" 2>/dev/null || { echo "::warning::$W: нет прежней версии для сравнения — пропускаю (выложите вручную, mode=deploy)"; continue; }
              git diff --quiet "$B" "${{ github.sha }}" -- "$F" && continue
              # защита: в Cloudflare должна лежать прежняя версия из репозитория
              git cat-file -e "$B:$F" 2>/dev/null || { echo "::notice::$W: файл только добавлен в репозиторий — не выкладываю"; continue; }
              if true; then
                git show "$B:$F" > "$RUNNER_TEMP/$W.prev.js"
                if ! cmp -s <(sed 's/[[:space:]]*$//' "$RUNNER_TEMP/$W.prev.js") <(sed 's/[[:space:]]*$//' "$RUNNER_TEMP/$W.cf.js"); then
                  echo "::error::$W: код в Cloudflare менялся вне репозитория — не выкладываю, чтобы не затереть. Запустите workflow с mode=pull, перенесите правки и залейте снова."; exit 1
                fi
              fi
            else
              [ "$ONLY" = all ] || [ "$ONLY" = "$W" ] || continue
            fi
            R=$(curl -sS -X PUT -H "Authorization: Bearer $T" \
              -F 'metadata={"main_module":"worker.js"};type=application/json' \
              -F "worker.js=@$F;filename=worker.js;type=application/javascript+module" \
              "https://api.cloudflare.com/client/v4/accounts/$ACC/workers/scripts/$W/content")
            if [ "$(echo "$R" | jq -r .success)" != "true" ]; then echo "::error::$W не выложен: $(echo "$R" | jq -c '.errors' | head -c 600)"; exit 1; fi
            echo "::notice::$W выложен: $(echo "$R" | jq -r '.result.modified_on // .result.id // "ok"')"; done_any=1
          done
          [ "$done_any" = 1 ] || echo "::notice::Выкладывать нечего"
      - name: Проверка
        if: env.MODE == 'auto' || env.MODE == 'deploy'
        shell: bash
        run: |
          sleep 3
          echo "::notice::license /cmd: $(curl -sS -m 20 https://wolfich-license.wolfichplay.workers.dev/cmd | head -c 120)"

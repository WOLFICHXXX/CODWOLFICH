name: Проверка адресов бота
on: { push: { branches: [bot], paths: [".github/workflows/check.yml"] } }
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.YC_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.YC_SECRET }}
      AWS_DEFAULT_REGION: ru-central1
      BUCKET: ${{ secrets.YC_BUCKET }}
    steps:
      - run: |
          export AWS_ACCESS_KEY_ID="$(printf %s "$AWS_ACCESS_KEY_ID" | tr -d '[:space:]')" AWS_SECRET_ACCESS_KEY="$(printf %s "$AWS_SECRET_ACCESS_KEY" | tr -d '[:space:]')"; BUCKET="$(printf %s "$BUCKET" | tr -d '[:space:]')"
          L=$(curl -sSI "https://wolfich-test.pages.dev/owner.bin?t=3" | grep -iE "^HTTP" | tr -d '\r')
          echo "::notice::old site owner.bin: $L"
          curl -sS -o b.bin "https://wolfich-bot.pages.dev/owner.bin?t=3"; curl -sS -o c.bin "https://storage.yandexcloud.net/wolfich-mirror/owner.bin?t=3"
          echo "::notice::sha bot=$(sha256sum b.bin|cut -c1-16) mirror=$(sha256sum c.bin|cut -c1-16)"
          F=$(aws --endpoint-url=https://storage.yandexcloud.net s3 ls "s3://$BUCKET/" | awk '{print $NF}' | tr '\n' ' ')
          echo "::notice::bucket root: $F"

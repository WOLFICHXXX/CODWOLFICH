name: Проверка адресов бота
on: { push: { branches: [bot], paths: [".github/workflows/check.yml"] } }
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          M=https://functions.yandexcloud.net/d4efk5gct1uv86m11gui
          python3 -c "import json,base64,os;print(json.dumps({'key':'WLF-test-invalid','msg':'t','imgs':[{'img':'data:image/jpeg;base64,'+base64.b64encode(os.urandom(150000)).decode(),'cap':'x'} for i in range(3)]}))" > big.json
          ls -la big.json
          for i in 1 2; do
            a=$(curl -s -m 70 -o /tmp/a -w "%{http_code} %{time_total}s" -X POST -H 'content-type: application/json' --data @big.json "$M?p=rcnote"); echo "::notice::mirror rcnote 600KB $i: $a $(head -c 160 /tmp/a)"
          done

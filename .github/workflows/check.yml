name: Проверка адресов бота
on: { push: { branches: [bot], paths: [".github/workflows/check.yml"] } }
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for u in "https://wolfich-bot.pages.dev/owner.bin" "https://storage.yandexcloud.net/wolfich-mirror/owner.bin" "https://wolfich-test.pages.dev/owner.bin"; do
            curl -sS -o x.bin -D h.txt "$u?t=$RANDOM"; echo "::notice::$u → $(sha256sum x.bin | cut -c1-16) $(head -c4 x.bin) $(grep -i '^cache-control\|^age\|^last-modified' h.txt | tr -d '\r' | tr '\n' ' ')"
            curl -sS -o y.bin "$u"; echo "::notice::$u (без ?t) → $(sha256sum y.bin | cut -c1-16)"
          done

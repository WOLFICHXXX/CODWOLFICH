name: Проверка адресов бота
on: { push: { branches: [bot], paths: [".github/workflows/check.yml"] } }
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          M=https://functions.yandexcloud.net/d4efk5gct1uv86m11gui
          L=https://wolfich-license.wolfichplay.workers.dev
          for i in 1 2 3; do
            a=$(curl -s -m 40 -o /tmp/a -w "%{http_code} %{time_total}s" "$M?p=ping"); echo "::notice::mirror ping $i: $a $(head -c 120 /tmp/a)"
            b=$(curl -s -m 40 -o /tmp/b -w "%{http_code} %{time_total}s" -X POST -H 'content-type: application/json' --data '{"op":"view","id":"zzz"}' "$M?p=al"); echo "::notice::mirror al $i: $b $(head -c 160 /tmp/b)"
            c=$(curl -s -m 40 -o /tmp/c -w "%{http_code} %{time_total}s" -X POST -H 'content-type: application/json' --data '{"op":"view","id":"zzz"}' "$L/al"); echo "::notice::direct al $i: $c $(head -c 160 /tmp/c)"
          done
